<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Sistema POS SaaS para Boutiques - Funcionamiento Offline">
    <title>Boutique POS SaaS</title>
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- Tailwind CSS (Carga CDN para desarrollo rápido en Spck Editor) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2563eb',
              secondary: '#4f46e5',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans select-none">

    <!-- Indicador de Conexión / Estado Offline -->
    <div id="network-status" class="hidden bg-yellow-500 text-white text-xs font-bold text-center py-1">
        Modo Offline — Las ventas se guardarán localmente
    </div>

    <!-- Contenedor Principal de la Aplicación -->
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Encabezado Base -->
        <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-lg font-bold">Boutique POS</h1>
            <span id="sync-status" class="text-xs bg-blue-700 px-2 py-1 rounded">Sincronizado</span>
        </header>

        <!-- Contenido Dinámico -->
        <        <!-- Contenido Dinámico -->
        <main class="flex-1 flex items-center justify-center p-4">
            
            <!-- Vista de Login (Se muestra cuando no hay sesión) -->
            <div id="auth-view" class="w-full max-w-sm bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold text-center mb-6 text-gray-800">Iniciar Sesión</h2>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Correo Electrónico</label>
                        <input type="email" id="login-email" required class="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="tu@correo.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña</label>
                        <input type="password" id="login-password" required class="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition text-sm">
                        Ingresar al Sistema
                    </button>
                </form>
                <div id="auth-error" class="mt-4 text-xs text-red-500 text-center hidden"></div>
            </div>

            <!-- Vista Principal del POS (Oculta hasta iniciar sesión) -->
            <div id="pos-view" class="hidden w-full max-w-md bg-white rounded-lg shadow p-6 text-center">
                <h2 class="text-xl font-bold mb-2">Panel de Ventas (POS)</h2>
                <p id="user-info" class="text-gray-600 text-sm mb-4">Cargando datos de la boutique...</p>
                <button id="btn-test" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded hover:bg-blue-700 transition mb-3">
                    Probar IndexedDB
                </button>
            </div>

        </main>

    </div>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Scripts de la Aplicación -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="./db.js"></script>
    <script src="./supabaseClient.js"></script>
    <script src="./app.js"></script>
</body>
</html>
